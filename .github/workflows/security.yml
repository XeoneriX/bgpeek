name: Security

on:
  schedule:
    - cron: '0 8 * * 1'  # Monday 8 AM
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev
      # Ignored vulns — all either unfixable upstream or not reachable at runtime.
      # Review this list on every dependency sweep and drop entries once a fix lands.
      #   pip (CVE-2026-3219, PYSEC-2026-196, PYSEC-2026-2876): pip is a build tool,
      #     never invoked by bgpeek at runtime; the container image ships no pip step.
      #   paramiko (PYSEC-2026-2858): no fixed release published upstream; netmiko
      #     pins the vulnerable range. Accepted residual risk — SSH targets are the
      #     operator's own routers, not attacker-controlled servers (see SECURITY_MODEL.md).
      - run: >-
          uv run pip-audit
          --ignore-vuln CVE-2026-3219
          --ignore-vuln PYSEC-2026-196
          --ignore-vuln PYSEC-2026-2876
          --ignore-vuln PYSEC-2026-2858
      - run: uv run bandit -c bandit.yaml -ll -r src/

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Trivy filesystem scan (HIGH+CRITICAL deps)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Trivy IaC + Dockerfile scan (HIGH+CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
