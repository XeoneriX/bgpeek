name: Security

on:
  schedule:
    - cron: '0 8 * * 1'  # Monday 8 AM
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev
      # Ignored vulns — all either unfixable upstream or not reachable at runtime.
      # Review this list on every dependency sweep and drop entries once a fix lands.
      #   paramiko (PYSEC-2026-2858): no fixed release published upstream; netmiko
      #     pins the vulnerable range. Accepted residual risk — SSH targets are the
      #     operator's own routers, not attacker-controlled servers (see SECURITY_MODEL.md).
      # Dropped 2026-09-15: the three pip entries (CVE-2026-3219, PYSEC-2026-196,
      #   PYSEC-2026-2876) are all fixed by pip 26.2, now floored in the dev extra.
      - run: >-
          uv run pip-audit
          --ignore-vuln PYSEC-2026-2858
      - run: uv run bandit -c bandit.yaml -ll -r src/

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Version lives in .github/trivy/Dockerfile (tracked by Dependabot); the action
      # verifies provenance before installing. skip-setup-trivy below relies on it.
      - uses: ./.github/actions/install-trivy
      - name: Trivy filesystem scan (HIGH+CRITICAL deps)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: 'true'
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Version lives in .github/trivy/Dockerfile (tracked by Dependabot); the action
      # verifies provenance before installing. skip-setup-trivy below relies on it.
      - uses: ./.github/actions/install-trivy
      - name: Trivy IaC + Dockerfile scan (HIGH+CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: 'true'
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
