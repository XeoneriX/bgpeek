name: Security

on:
  schedule:
    - cron: '0 8 * * 1'  # Monday 8 AM
  workflow_dispatch:

env:
  # Trivy scanner binary. Bump together with aquasecurity/trivy-action below.
  # Deliberately not named TRIVY_VERSION: the trivy CLI reads TRIVY_*-prefixed env vars
  # as flags, and `--version` is a real one.
  TRIVY_INSTALL_VERSION: v0.74.0

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev
      # Ignored vulns — all either unfixable upstream or not reachable at runtime.
      # Review this list on every dependency sweep and drop entries once a fix lands.
      #   paramiko (PYSEC-2026-2858): no fixed release published upstream; netmiko
      #     pins the vulnerable range. Accepted residual risk — SSH targets are the
      #     operator's own routers, not attacker-controlled servers (see SECURITY_MODEL.md).
      # Dropped 2026-09-15: the three pip entries (CVE-2026-3219, PYSEC-2026-196,
      #   PYSEC-2026-2876) are all fixed by pip 26.2, now floored in the dev extra.
      - run: >-
          uv run pip-audit
          --ignore-vuln PYSEC-2026-2858
      - run: uv run bandit -c bandit.yaml -ll -r src/

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Trivy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # setup-trivy shells out to trivy's contrib/install.sh, which resolves the release
        # tag over *unauthenticated* github.com and fails with "unable to find '<tag>'" the
        # moment the runner IP is rate-limited (broke this workflow 2026-08-24..09-14).
        # `gh` uses GITHUB_TOKEN, so it gets an authenticated quota. The action's own DB
        # cache step is unaffected by skip-setup-trivy.
        run: |
          gh release download "$TRIVY_INSTALL_VERSION" --repo aquasecurity/trivy \
            --pattern 'trivy_*_Linux-64bit.tar.gz' --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/trivy_*_Linux-64bit.tar.gz -C /usr/local/bin trivy
          trivy --version
      - name: Trivy filesystem scan (HIGH+CRITICAL deps)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: 'true'
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Trivy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # setup-trivy shells out to trivy's contrib/install.sh, which resolves the release
        # tag over *unauthenticated* github.com and fails with "unable to find '<tag>'" the
        # moment the runner IP is rate-limited (broke this workflow 2026-08-24..09-14).
        # `gh` uses GITHUB_TOKEN, so it gets an authenticated quota. The action's own DB
        # cache step is unaffected by skip-setup-trivy.
        run: |
          gh release download "$TRIVY_INSTALL_VERSION" --repo aquasecurity/trivy \
            --pattern 'trivy_*_Linux-64bit.tar.gz' --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/trivy_*_Linux-64bit.tar.gz -C /usr/local/bin trivy
          trivy --version
      - name: Trivy IaC + Dockerfile scan (HIGH+CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: 'true'
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
